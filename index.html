<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CakGup ToDo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-box" id="loginBox">
    <h1>CakGup Family</h1>
    <input type="password" id="password" placeholder="Masukkan kode">
    <button onclick="login()">Masuk</button>
    <p id="loginError" hidden>Kode salah</p>
  </div>

  <div id="app" hidden>
    <h2>Dashboard Tugas</h2>
    <div id="taskList"></div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
